name: LRI Model Run 001 control-plane smoke

on:
  push:
    paths:
      - "lineage-recursive-improvement/model-run-001/**"
      - ".github/workflows/lri-model-run-smoke.yml"
  pull_request:
    paths:
      - "lineage-recursive-improvement/model-run-001/**"
      - ".github/workflows/lri-model-run-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze deterministic CI task bundle
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python freeze_tasks.py \
            --seed "PUBLIC-CI-SMOKE-SEED-NOT-EVIDENCE" \
            --out /tmp/lri-freeze \
            --training-per-phase 3 \
            --heldout-per-phase 3

      - name: Run scalar A/B/C plus required control-plane ablations
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python run_matrix.py \
            --config config.smoke.json \
            --freeze-dir /tmp/lri-freeze \
            --task-adapter "python adapters/free_rule_adapter.py" \
            --mutation-adapter "python adapters/free_rule_adapter.py" \
            --out-dir /tmp/lri-results \
            --timeout 10

      - name: Validate scalar matrix invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/lri-results/MATRIX_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['evidence_status'] == 'smoke_only_not_model_evidence', summary
          fairness = summary['fairness_checks']
          assert fairness['same_mutation_calls'], fairness
          assert fairness['same_task_calls'], fairness
          assert fairness['same_candidate_count'], fairness
          assert fairness['token_accounting_exact_b'], fairness
          assert fairness['token_accounting_exact_c'], fairness
          expected = {
              'A_fixed',
              'B_monolithic',
              'C_lineage_diversity',
              'C_lineage_score_only',
              'C_lineage_equal_memory',
              'C_lineage_pruned',
          }
          assert set(summary['runs']) == expected, summary['runs'].keys()
          for name, run in summary['runs'].items():
              assert len(run['recovery_generations']) == 4, (name, run)
              assert run['budget']['agent_task_calls'] > 0, (name, run)
          print(json.dumps(summary, indent=2))
          PY

      - name: Run batched A/B/C plus ablations
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python run_matrix.py \
            --config config.batch-smoke.json \
            --freeze-dir /tmp/lri-freeze \
            --controller-script batch_controller.py \
            --task-adapter "python adapters/free_rule_adapter.py" \
            --mutation-adapter "python adapters/free_rule_adapter.py" \
            --out-dir /tmp/lri-batch-results \
            --timeout 10

      - name: Validate batch fairness and lower task-model-call count
        run: |
          python - <<'PY'
          import json
          scalar = json.load(open('/tmp/lri-results/MATRIX_SUMMARY.json', encoding='utf-8'))
          batch = json.load(open('/tmp/lri-batch-results/MATRIX_SUMMARY.json', encoding='utf-8'))
          assert batch['evaluation_batch_tasks'] is True, batch
          fairness = batch['fairness_checks']
          assert fairness['same_mutation_calls'], fairness
          assert fairness['same_task_calls'], fairness
          assert fairness['same_candidate_count'], fairness
          b_scalar = scalar['runs']['B_monolithic']['budget']['agent_task_calls']
          b_batch = batch['runs']['B_monolithic']['budget']['agent_task_calls']
          assert b_batch < b_scalar, (b_batch, b_scalar)
          c_scalar = scalar['runs']['C_lineage_diversity']['budget']['agent_task_calls']
          c_batch = batch['runs']['C_lineage_diversity']['budget']['agent_task_calls']
          assert c_batch < c_scalar, (c_batch, c_scalar)
          print(json.dumps({'B_scalar': b_scalar, 'B_batch': b_batch, 'C_scalar': c_scalar, 'C_batch': c_batch}, indent=2))
          PY

      - name: Validate two-call adapter doctor contract
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python doctor_adapter.py \
            --task-adapter "python adapters/free_rule_adapter.py" \
            --mutation-adapter "python adapters/free_rule_adapter.py" \
            --timeout 10 > /tmp/lri-doctor.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/lri-doctor.json', encoding='utf-8'))
          assert data['status'] == 'pass', data
          assert data['exact_token_accounting_available'] is True, data
          assert data['task_batch']['task_ids_returned'] == ['doctor-add', 'doctor-neg'], data
          PY

      - name: Validate 48-call non-evidence pilot topology
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          cp config.local-model.pilot.template.json /tmp/pilot-config.json
          python - <<'PY'
          import json
          p='/tmp/pilot-config.json'
          data=json.load(open(p, encoding='utf-8'))
          data['frozen_timestamp']='2026-09-11T00:00:00Z'
          data['model']['provider']='deterministic-smoke-adapter'
          data['model']['id']='free-rule-adapter-v0.1'
          data['model']['version']='ci-smoke'
          json.dump(data, open(p,'w',encoding='utf-8'), indent=2, ensure_ascii=False)
          PY
          python run_pilot.py \
            --config /tmp/pilot-config.json \
            --freeze-dir /tmp/lri-freeze \
            --controller-script batch_controller.py \
            --task-adapter "python adapters/free_rule_adapter.py" \
            --mutation-adapter "python adapters/free_rule_adapter.py" \
            --out-dir /tmp/lri-pilot \
            --timeout 10 > /tmp/lri-pilot-output.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/lri-pilot/PILOT_SUMMARY.json',encoding='utf-8'))
          assert data['evidence_status']=='operational_pilot_not_evidence', data
          assert data['total_model_call_attempts']==48, data
          assert data['pilot_acceptance_checks']['B_C_core_fairness'] is True, data
          assert data['pilot_acceptance_checks']['all_groups_produced_four_phase_records'] is True, data
          PY

      - name: Smoke repeated-run analyzer contract
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python analyze_repeats.py \
            --root /tmp/lri-results \
            --max-generations 2 \
            --min-runs 1 \
            --bootstrap-iterations 100 \
            --output /tmp/lri-analysis.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/lri-analysis.json', encoding='utf-8'))
          assert data['runs_found'] == 1, data
          assert data['fairness_confounded'] is False, data
          assert data['automated_classification_suggestion'] in {
              'supports_lri_under_tested_conditions',
              'no_detectable_lri_advantage',
              'supports_monolithic_under_tested_conditions',
              'inconclusive_due_to_budget_or_evaluator_confounds',
          }, data
          PY

      - name: Prove analyzer is not directionally hard-coded for LRI
        working-directory: lineage-recursive-improvement/model-run-001
        run: python analysis_selftest.py

      - name: Estimate scalar and batch call topology
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python estimate_budget.py --config config.smoke.json --training-per-phase 3 --heldout-per-phase 3 --primary-repeats 20 --full-matrix-repeats 20 > /tmp/scalar-budget.json
          python estimate_budget.py --config config.batch-smoke.json --training-per-phase 3 --heldout-per-phase 3 --primary-repeats 20 --full-matrix-repeats 20 > /tmp/batch-budget.json
          python estimate_budget.py --config config.local-model.pilot.template.json --training-per-phase 3 --heldout-per-phase 3 --primary-repeats 1 --full-matrix-repeats 1 > /tmp/pilot-budget.json
          python - <<'PY'
          import json
          scalar = json.load(open('/tmp/scalar-budget.json', encoding='utf-8'))
          batch = json.load(open('/tmp/batch-budget.json', encoding='utf-8'))
          pilot = json.load(open('/tmp/pilot-budget.json', encoding='utf-8'))
          assert batch['matrix']['full_A_B_plus_four_C_conditions_calls_per_run'] < scalar['matrix']['full_A_B_plus_four_C_conditions_calls_per_run'], (batch, scalar)
          assert pilot['matrix']['primary_A_B_C_calls_per_run'] == 48, pilot
          print(json.dumps({'scalar': scalar['matrix'], 'batch': batch['matrix'], 'pilot': pilot['matrix']}, indent=2))
          PY

      - name: Byte-compile Python control plane
        working-directory: lineage-recursive-improvement/model-run-001
        run: |
          python -m py_compile \
            freeze_tasks.py \
            controller.py \
            batch_controller.py \
            run_matrix.py \
            run_pilot.py \
            run_repeated.py \
            doctor_adapter.py \
            analyze_repeats.py \
            analysis_selftest.py \
            estimate_budget.py \
            adapters/free_rule_adapter.py \
            adapters/local_openai_compatible.py
